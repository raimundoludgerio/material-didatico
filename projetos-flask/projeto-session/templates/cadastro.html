{% extends 'base.html' %}

{% block titulo %} Login {% endblock %}
{% block conteudo %}
<form action="/cadastro" method="post">
    <h2>Efetuar login</h2>
    <div class="form-group">
        <label for="nome">Qual o seu nome?</label>
        <input type="text" name="nome" class="form-control" id="nome" placeholder="Informe seu nome">
    </div>
    <div class="form-group">
        <label for="email">Qual o seu e-mail?</label>
        <input type="email" name="email" class="form-control" id="email" placeholder="Informe o seu e-mail">
    </div>
    <div class="form-group">
        <label for="senha">Qual sua senha?</label>
        <input type="password" class="form-control" id="senha" placeholder="Informe sua senha?">
    </div>
    <button type="submit" class="btn btn-primary">Entrar</button>
</form>
{% endblock %}
